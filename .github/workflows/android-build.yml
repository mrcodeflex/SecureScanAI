name: Android APK

# Builds the SecureScan AI Android app in the cloud (no Android Studio needed).
#   - Run it by hand:  Actions tab > "Android APK" > Run workflow
#   - Or automatically when the app, the prepare/signing scripts or this file change on main
#   - Pushing a tag such as v1.0.0 also publishes the APK as a GitHub release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "scripts/prepare_android.py"
      - "scripts/configure_android_signing.py"
      - ".github/workflows/android-build.yml"
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate the Flutter project
        id: project
        run: |
          set -euo pipefail
          dir=""
          while IFS= read -r f; do
            if grep -q "sdk: flutter" "$f"; then dir="$(dirname "$f")"; break; fi
          done < <(find . -name pubspec.yaml -not -path "*/node_modules/*" -not -path "*/.dart_tool/*" | sort)
          if [ -z "$dir" ]; then
            echo "::error::No Flutter project found (a pubspec.yaml containing 'sdk: flutter')."
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Flutter project directory: $dir"

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare Android platform files
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: python3 scripts/prepare_android.py --project "$PROJECT_DIR"

      - name: Configure release signing (only if secrets exist)
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/configure_android_signing.py --project "$PROJECT_DIR"

      - name: Install Dart and Flutter dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Check Dart formatting (advisory)
        # Formatter output can differ slightly between Flutter releases, so this reports but does not block the build.
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.dir }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          SCANNER_URL: ${{ vars.SCANNER_URL }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          args=(--release --build-number "$RUN_NUMBER")
          if [ -n "${SCANNER_URL:-}" ]; then args+=("--dart-define=SCANNER_URL=${SCANNER_URL}"); fi
          flutter build apk "${args[@]}" 2>&1 | tee build.log

      - name: Verify APK and write build information
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$apk" ]; then
            echo "::error::The release APK was not produced at $apk"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/SecureScanAI.apk
          (cd dist && sha256sum SecureScanAI.apk > SecureScanAI.apk.sha256)
          signer_info="apksigner not found; signature was not verified"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -n "$apksigner" ]; then
            if "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apksigner.txt" 2>&1; then
              signer_info="apksigner verify: OK ($(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/apksigner.txt" || echo 'digest not shown'))"
            else
              signer_info="apksigner verify: FAILED (see build log)"
            fi
          fi
          {
            echo "SecureScan AI - Android build information"
            echo "Built (UTC):     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Repository:      $GITHUB_REPOSITORY"
            echo "Commit:          $GITHUB_SHA"
            echo "Ref:             $GITHUB_REF_NAME"
            echo "Run number:      $GITHUB_RUN_NUMBER"
            echo "Application ID:  com.securescanai.app"
            echo "Flutter:         $(flutter --version | head -n1)"
            echo "Signing mode:    $(cat "$PROJECT_DIR/build/signing_mode.txt")"
            echo "Signature check: $signer_info"
            echo "APK size bytes:  $(stat -c %s dist/SecureScanAI.apk)"
            echo "SHA-256:         $(cut -d' ' -f1 dist/SecureScanAI.apk.sha256)"
          } > dist/build-info.txt
          cat dist/build-info.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SecureScanAI-Android-APK
          path: |
            dist/SecureScanAI.apk
            dist/SecureScanAI.apk.sha256
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SecureScanAI-build-logs
          path: |
            ${{ steps.project.outputs.dir }}/build.log
            ${{ steps.project.outputs.dir }}/android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the built APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SecureScanAI-Android-APK
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/SecureScanAI.apk dist/SecureScanAI.apk.sha256 dist/build-info.txt \
            --repo "$GITHUB_REPOSITORY" --title "SecureScan AI $GITHUB_REF_NAME" --notes-file dist/build-info.txt
